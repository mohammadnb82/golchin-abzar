<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد ابزارهای من</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        /* افکت شیشه‌ای و کارت‌ها */
        .glass-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* هاور برای کارت‌های فعال */
        .card-active:hover {
            transform: translateY(-5px) scale(1.02);
            background: rgba(30, 41, 59, 0.9);
            border-color: #3b82f6;
            box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.3);
        }

        /* استایل کارت‌های خالی (غیرفعال) */
        .card-empty {
            opacity: 0.5;
            border-style: dashed;
            cursor: default;
        }
        
        /* اسکرول بار زیبا */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="min-h-screen p-6 md:p-10 bg-[url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop')] bg-cover bg-fixed bg-center">
    
    <!-- لایه تاریک روی پس‌زمینه -->
    <div class="absolute inset-0 bg-slate-900/90 fixed z-0"></div>

    <div class="relative z-10 max-w-7xl mx-auto">
        <!-- هدر -->
        <header class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-purple-400 to-emerald-400 mb-4 drop-shadow-lg">
                <i class="fas fa-layer-group ml-3"></i>مرکز فرماندهی ابزارها
            </h1>
            <p class="text-slate-400 text-lg">مجموعه ابزارهای هوشمند و کاربردی</p>
        </header>

        <!-- شبکه ابزارها (تولید شده توسط جاوااسکریپت) -->
        <div id="tools-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-6">
            <!-- کارت‌ها اینجا قرار می‌گیرند -->
        </div>
    </div>

    <!-- تنظیمات و تولید خودکار کارت‌ها -->
    <script>
        // ==========================================
        // ⚙️ تنظیمات ابزارها (اینجا را ویرایش کنید)
        // ==========================================
        const toolsConfig = [
            // ابزار ۱: فعال
            { 
                id: 1, 
                title: "دوربین تشخیص حرکت", 
                icon: "fa-video", 
                link: "motion-cam.html", // نام فایل HTML که بعدا می‌سازید
                active: true,
                color: "text-red-400"
            },
            // ابزار ۲: فعال
            { 
                id: 2, 
                title: "دوربین تشخیص انسان", 
                icon: "fa-user-secret", 
                link: "human-cam.html",
                active: true,
                color: "text-blue-400"
            }
        ];

        // تولید خودکار ابزار ۳ تا ۵۰ (به عنوان جای خالی)
        for (let i = 3; i <= 50; i++) {
            toolsConfig.push({
                id: i,
                title: `ابزار شماره ${i}`,
                icon: "fa-cube",
                link: "#",
                active: false, // هنوز فعال نیست
                color: "text-gray-500"
            });
        }

        // ==========================================
        // 🔧 موتور ساخت کارت‌ها (دست نزنید)
        // ==========================================
        const grid = document.getElementById('tools-grid');

        toolsConfig.forEach(tool => {
            const isActive = tool.active;
            const cardClass = isActive ? 'glass-card card-active cursor-pointer' : 'glass-card card-empty';
            const linkTarget = isActive ? `href="${tool.link}"` : '';
            const statusBadge = isActive 
                ? '<span class="absolute top-3 right-3 w-2 h-2 bg-emerald-500 rounded-full shadow-[0_0_10px_#10b981]"></span>' 
                : '<span class="absolute top-3 right-3 px-2 py-0.5 bg-gray-700/50 rounded text-[10px] text-gray-400">خالی</span>';

            const html = `
                <a ${linkTarget} class="block relative group h-full">
                    <div class="${cardClass} rounded-2xl p-6 h-40 flex flex-col items-center justify-center text-center relative overflow-hidden">
                        ${statusBadge}
                        
                        <!-- آیکون -->
                        <div class="mb-4 transform transition-transform group-hover:scale-110 duration-300">
                            <i class="fas ${tool.icon} text-3xl ${isActive ? tool.color : 'text-gray-600'}"></i>
                        </div>
                        
                        <!-- عنوان -->
                        <h3 class="font-bold text-sm md:text-base ${isActive ? 'text-gray-100' : 'text-gray-500'}">
                            ${tool.title}
                        </h3>
                        
                        <!-- افکت نور پس‌زمینه هنگام هاور (فقط برای فعال‌ها) -->
                        ${isActive ? '<div class="absolute inset-0 bg-gradient-to-t from-blue-500/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>' : ''}
                    </div>
                </a>
            `;
            grid.innerHTML += html;
        });
    </script>
</body>
</html>
